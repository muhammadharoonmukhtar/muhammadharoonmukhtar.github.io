<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | ESparks</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fffaf5;
      color: #24302a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: min(600px, 100%);
      background: white;
      padding: 50px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(79, 45, 25, 0.12);
      border: 1px solid #eee3db;
    }

    .check {
      width: 75px;
      height: 75px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #e8f5ed;
      color: #3b8b63;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 38px;
    }

    p {
      color: #68736d;
      font-size: 17px;
      line-height: 1.7;
      margin: 10px auto;
      max-width: 500px;
    }

    .download-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 32px;
      background: #e77845;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    .download-btn:hover {
      background: #c95d2d;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #8a918d;
    }

    .brand {
      margin-top: 30px;
      font-weight: 800;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="check">✓</div>

    <h1>Thank You!</h1>

    <p>
      Your purchase was successful.
    </p>

    <p>
      Your copy of <strong>200 Healthy Morning Recipes for Kids</strong>
      is ready.
    </p>

    <a
      class="download-btn"
      href="https://drive.google.com/uc?export=download&id=1M1L-vA7rROXtJSpwU7NogM4937W6kyy7"
      target="_blank"
      rel="noopener"
    >
      DOWNLOAD YOUR EBOOK
    </a>

    <div class="note">
      If the download does not start automatically, the button will open your ebook.
    </div>

    <div class="brand">
      ESparks
    </div>

  </div>

</body>
</html>
